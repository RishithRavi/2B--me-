[project]
name = "twobme-common"
version = "0.1.0"
description = "2bME shared contracts: DTOs, feature spec, config loaders (owner: Claude)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twobme_common"]
