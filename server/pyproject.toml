[project]
name = "twobme-server"
version = "0.1.0"
description = "2bME FastAPI backend (owner: Claude; server/app/voice owned by Codex 2 after CP0)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "twobme-common",
  "twobme-features",
  "twobme-ml",
  # base hearsay only (numpy, soundfile, soxr, pyyaml): the voice routes import hearsay.phrases/audio/dsp.
  # The torch/model stack is the optional `voice` extra below, never the default install.
  "hearsay",
  "fastapi==0.141.*",
  "uvicorn[standard]==0.54.*",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "asyncpg==0.31.0",
  "pgvector==0.5.0",
  "numpy",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "joblib",
  "pandas",
  "pyarrow",
  "openai==3.19.*",
  "pyotp",
  "argon2-cffi",
  "itsdangerous",
  "cryptography",
  "httpx",
  "pyyaml",
]

[project.optional-dependencies]
# Real voice (VOICE_MODE=real): torch, transformers, speechbrain, silero-vad, faster-whisper, elevenlabs.
# Opt-in only (`uv sync --package twobme-server --extra voice`, or the images' UV_EXTRAS build arg), because
# it pulls CPU torch + model code into the image; weights are fetched separately (§6 A4).
voice = ["hearsay[server]"]

[tool.uv.sources]
twobme-common = { workspace = true }
twobme-features = { workspace = true }
twobme-ml = { workspace = true }
hearsay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
