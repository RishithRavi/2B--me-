[project]
name = "twobme-workspace"
version = "0.1.0"
description = "2bME: continuous behavioral identity (uv workspace root; owner: Claude)"
requires-python = ">=3.12,<3.13"

# Members that don't exist yet are ignored by uv, so each owner can add their
# package directory (with its own pyproject.toml) without touching this file.
[tool.uv.workspace]
members = [
  "packages/common",    # twobme_common   [Claude]
  "packages/features",  # twobme_features [Codex 1]
  "packages/ml",        # twobme_ml       [Codex 1]
  "packages/hearsay",   # hearsay         [Codex 2]
  "agent",              # twobme_agent    [Codex 1]
  "server",             # FastAPI app     [Claude]
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
